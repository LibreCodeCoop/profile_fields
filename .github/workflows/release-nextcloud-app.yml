name: Create Nextcloud app release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH form
        required: true
        type: string
      stable_branch:
        description: Stable branch to release from
        required: true
        type: string
      milestone:
        description: Closed milestone that must have no open issues
        required: false
        default: ''
        type: string
      blocker_queries:
        description: JSON array of GitHub issue search fragments that must return zero open items
        required: false
        default: '[]'
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.stable_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create v${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15

    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stable_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.3 for release-tool
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - id: release-tool
        name: Setup release-tool v0.11.2
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/LibreCodeCoop/release-tool/releases/download/v0.11.2"
          curl --fail --silent --show-error --location "${base}/release-tool.phar" -o "${RUNNER_TEMP}/release-tool.phar"
          curl --fail --silent --show-error --location "${base}/release-tool.phar.sha256" -o "${RUNNER_TEMP}/release-tool.phar.sha256"
          (cd "${RUNNER_TEMP}" && sha256sum --check release-tool.phar.sha256)
          echo "path=${RUNNER_TEMP}/release-tool.phar" >> "${GITHUB_OUTPUT}"

      - name: Validate release plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOOL_PATH: ${{ steps.release-tool.outputs.path }}
          RELEASE_VERSION: ${{ inputs.version }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          RELEASE_MILESTONE: ${{ inputs.milestone }}
          BLOCKER_QUERIES: ${{ inputs.blocker_queries }}
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/release-preflight.json"
          php "${RELEASE_TOOL_PATH}" release:preflight \
            --version "${RELEASE_VERSION}" \
            --stable-branch "${STABLE_BRANCH}" \
            --current-ref "${STABLE_BRANCH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --milestone "${RELEASE_MILESTONE}" \
            --blocker-queries-json "${BLOCKER_QUERIES}" \
            --json | tee "${plan}"
          {
            echo "## Release preflight"
            echo
            echo '~~~json'
            cat "${plan}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate publication credentials
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::APP_PRIVATE_KEY is not configured."
            exit 1
          fi
          if [ -z "$APPSTORE_TOKEN" ]; then
            echo "::error::APPSTORE_TOKEN is not configured."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$STABLE_BRANCH" \
            --title "v$RELEASE_VERSION" \
            --generate-notes
