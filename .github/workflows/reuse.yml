name: reuse

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stable*

jobs:
  reuse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run REUSE lint
        uses: fsfe/reuse-action@v6
